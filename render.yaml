# Render Blueprint (https://render.com/docs/blueprint-spec). Free web service for the Next.js app in web/.
# Secrets use sync: false: Render asks for the value in the dashboard at Blueprint creation and never stores it here.
services:
  - type: web
    name: carthold
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start # next start binds 0.0.0.0 and reads $PORT, which Render sets
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION # web/package.json engines: >=20.9.0
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: CLIENT_IP_HEADER # Cloudflare (in front of Render) overwrites this with the real client IP; XFF is only appended to
        value: true-client-ip
      - key: TRUSTED_PROXY_HOPS # fallback only, when CLIENT_IP_HEADER is absent
        value: "1"
      - key: LIVE_RUNS_PER_DAY # global daily cap on Live runs (each one drives the Gemini agent, plus PayPal sandbox calls)
        value: "60"
      - key: SIMULATED_RUNS_PER_DAY # global daily cap on Simulated runs (no Gemini, but real PayPal sandbox authorize/void calls)
        value: "200"
      - key: NEXT_MANUAL_SIG_HANDLE # next start skips its own SIGTERM exit, so session.ts can void held PayPal authorizations first (next/dist/server/lib/start-server.js)
        value: "1"
      - key: PAYPAL_HOLD_PAYER # held orders: "paypal" = the buyer approves each one in PayPal (default); "card" = instant fallback to the sandbox test card if sandbox buyer approval breaks
        value: paypal
      - key: PUBLIC_ORIGIN # set after the first deploy to https://<service>.onrender.com (no trailing slash)
        sync: false
      - key: PAYPAL_WEBHOOK_ID # id printed by web/scripts/paypal-webhook-register.mts (not a secret); unset = /api/paypal/webhook answers 503
        sync: false
